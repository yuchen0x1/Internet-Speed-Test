[package]
name = "netvision-pro"
version = "1.13.0"
description = "NetVision Pro - 专业级桌面网络测速与诊断软件"
authors = ["NetVision Pro"]
edition = "2021"

[lib]
name = "netvision_pro_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
async-trait = "0.1.92"
bytes = "1.12.1"
chrono = { version = "0.4.45", features = ["serde"] }
futures-core = "0.3.34"
futures-util = "0.3.34"
hostname = "0.4.2"
log = "0.4.35"
netdev = "0.47.0"
rand = "0.10.3"
regex = "1.13.1"
reqwest = { version = "0.13.5", default-features = false, features = ["stream", "native-tls", "http2", "query"] }
rusqlite = { version = "0.41.1", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sysinfo = "0.40.1"
tauri = { version = "2.12.5", features = ["tray-icon", "image-png"] }
tauri-plugin-autostart = "2.7.0"
tauri-plugin-dialog = "2.8.4"
tauri-plugin-log = "2.10.1"
tauri-plugin-notification = "2.8.0"
tauri-plugin-single-instance = "2.5.5"
tauri-plugin-updater = "2.14.1"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["full"] }
tokio-tungstenite = { version = "0.30", features = ["connect", "native-tls"] }
tokio-util = { version = "0.7.20", features = ["rt"] }
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_NetworkManagement_IpHelper", "Win32_Networking_WinSock", "Win32_System_Console"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
