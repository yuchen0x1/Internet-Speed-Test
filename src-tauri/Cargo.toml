[package]
name = "netvision-pro"
version = "1.15.7"
description = "NetVision Pro - 专业级桌面网络测速与诊断软件"
authors = ["NetVision Pro"]
edition = "2021"
default-run = "netvision-pro"

[features]
default = ["desktop"]
desktop = ["dep:tauri", "dep:tauri-build", "dep:sysinfo", "dep:tauri-plugin-autostart", "dep:tauri-plugin-dialog", "dep:tauri-plugin-log", "dep:tauri-plugin-notification", "dep:tauri-plugin-single-instance", "dep:tauri-plugin-updater"]

[[bin]]
name = "netvision-pro"
path = "src/main.rs"
required-features = ["desktop"]

[[bin]]
name = "netvision-cli"
path = "src/bin/netvision-cli.rs"

[lib]
name = "netvision_pro_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [], optional = true }

[dependencies]
async-trait = "0.1.92"
bytes = "1.12.1"
chrono = { version = "0.4.45", features = ["serde"] }
futures-core = "0.3.34"
futures-util = "0.3.34"
hostname = "0.4.2"
log = "0.4.35"
netdev = "0.47.0"
rand = "0.10.3"
regex = "1.13.1"
reqwest = { version = "0.13.5", default-features = false, features = ["stream", "native-tls", "http2", "query", "socks"] }
rusqlite = { version = "0.41.1", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sysinfo = { version = "0.40.1", optional = true }
tauri = { version = "2.12.5", features = ["tray-icon", "image-png"], optional = true }
tauri-plugin-autostart = { version = "2.7.0", optional = true }
tauri-plugin-dialog = { version = "2.8.4", optional = true }
tauri-plugin-log = { version = "2.10.1", optional = true }
tauri-plugin-notification = { version = "2.8.0", optional = true }
tauri-plugin-single-instance = { version = "2.5.5", optional = true }
tauri-plugin-updater = { version = "2.14.1", optional = true }
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["full"] }
tokio-tungstenite = { version = "0.30", features = ["connect", "native-tls"] }
tokio-util = { version = "0.7.20", features = ["rt"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_NetworkManagement_IpHelper", "Win32_Networking_WinSock", "Win32_System_Console"] }
winreg = "0.56.0"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
