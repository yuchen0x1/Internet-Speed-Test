name: Headless CLI
on:
  push:
    branches: [main, 'codex/**']
  pull_request:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
jobs:
  headless:
    name: headless (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, asset: windows-x64 }
          - { os: ubuntu-22.04, asset: linux-x64 }
          - { os: macos-15-intel, asset: macos-x64 }
          - { os: macos-15, asset: macos-arm64 }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: { persist-credentials: false }
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with: { node-version: 22.22.2, cache: npm }
      - uses: dtolnay/rust-toolchain@263313d2989f864a2b8613f97277288638e7d8f8 # 1.99.1
        with: { components: 'rustfmt, clippy' }
      - uses: Swatinem/rust-cache@e9d7b9f1e587218970671bac74e5511ed9506e6a # v2
        with: { workspaces: src-tauri, key: headless }
      - run: node scripts/check-version.mjs
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
      - run: cargo clippy --locked --manifest-path src-tauri/Cargo.toml --no-default-features --all-targets -- -D warnings
      - run: cargo test --locked --manifest-path src-tauri/Cargo.toml --no-default-features
      - run: cargo build --locked --release --manifest-path src-tauri/Cargo.toml --no-default-features --bin netvision-cli
      - run: node scripts/smoke-cli.mjs
      - run: node scripts/package-cli.mjs ${{ matrix.asset }}
      - name: Sign CLI archive for a tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          npm ci --registry=https://registry.npmjs.org
          VERSION=$(node -p "require('./package.json').version")
          for file in release-artifacts/*.zip release-artifacts/*.tar.gz; do
            test -f "$file" || continue
            npx tauri signer sign --app-version "$VERSION" "$file"
          done
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: cli-${{ matrix.asset }}
          path: release-artifacts/*
          if-no-files-found: error
          retention-days: 7
