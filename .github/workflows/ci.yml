name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22.22.2
          cache: npm

      - uses: dtolnay/rust-toolchain@263313d2989f864a2b8613f97277288638e7d8f8 # 1.99.1
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@e9d7b9f1e587218970671bac74e5511ed9506e6a # v2
        with:
          workspaces: src-tauri

      - name: 安装前端依赖
        run: npm ci --registry=https://registry.npmjs.org

      - name: 检查版本日志同步
        run: npm run docs:check

      - name: 统一版本检查
        run: npm run version:check

      - name: 检查 IPC 契约
        run: npm run ipc:check

      - name: 前端依赖审计
        run: npm run security:check

      - name: Rust 依赖审计
        uses: taiki-e/install-action@75a7c0f87bd666af3cdb75c5b9e9d03ab6044e6f # v2
        with:
          tool: cargo-audit

      - name: 检查 Rust 漏洞
        # 已知漏洞阻断；维护性/unsound 告警继续完整输出并复核构建范围。
        # chrono 是直接运行时依赖，其余当前告警来自未发布的 Linux 桌面依赖树。
        # 不通过 ignore 隐藏告警；各公告和残余风险见 SECURITY.md。
        run: cargo audit --file src-tauri/Cargo.lock

      - name: Rust 格式检查
        run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check

      - name: Rust 严格 lint
        run: cargo clippy --locked --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings

      - name: 类型检查
        run: npm run typecheck

      - name: 前端单元测试
        run: npm run test

      - name: 发布资产一致性回归测试
        run: node --test scripts/tests/release-assets.node.mjs

      - name: 前端生产构建
        run: npm run build

      # 真实网络测试标记 #[ignore],默认跑离线可判定的用例
      - name: 后端单元测试
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml
